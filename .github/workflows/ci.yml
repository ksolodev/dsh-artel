name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The suite's fixtures use Windows paths (`C:\Users\me\.dsh\...`, `D:\copies`),
        # so it is graded on Windows. A POSIX pass needs platform-neutral fixtures
        # first; see the release notes.
        os: [windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: node --test test/*.test.js
